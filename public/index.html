<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerial & Camera Production</title>
<meta name="description" content="Drone and camera production for real estate, weddings, brands and travel. FAA Part 107 certified.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--text:#f5f5f5;--muted:#8c8c8c;--line:#232323;--soft:#141414;--green:#22c55e;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px}
  nav{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.85);backdrop-filter:blur(12px)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;font-size:14px}
  .logo{font-weight:600;letter-spacing:-.01em}
  nav .links{display:flex;gap:32px;color:var(--muted)}
  nav .links a:hover{color:var(--text)}
  .hero{padding-top:96px;padding-bottom:48px}
  .meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:28px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:p 2s infinite}
  @keyframes p{50%{opacity:.3}}
  h1{font-weight:500;font-size:clamp(48px,9vw,136px);line-height:.95;letter-spacing:-.045em}
  h1 span{color:var(--muted)}
  .hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-top:40px;flex-wrap:wrap}
  .hero-row p{max-width:34ch;color:var(--muted);font-size:17px}
  .btn{display:inline-flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);font:500 15px "Inter Tight",sans-serif;padding:14px 26px;border:0;border-radius:2px;cursor:pointer;transition:opacity .2s}
  .btn:hover{opacity:.8}
  .btn.line{background:none;color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
  .media{aspect-ratio:21/9;background:var(--soft);overflow:hidden}
  .cred{display:grid;grid-template-columns:1fr 2fr;gap:32px;padding:28px 0;border-bottom:1px solid var(--line)}
  .cred ul{list-style:none;display:grid;gap:10px}
  .cred li{font-size:clamp(20px,2.2vw,28px);letter-spacing:-.02em;line-height:1.25}
  .cred li span{color:var(--muted)}
  .media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
  section{padding:120px 0 0}
  .head{display:grid;grid-template-columns:1fr 2fr;gap:32px;margin-bottom:48px}
  .label{font-size:13px;color:var(--muted)}
  h2{font-weight:500;font-size:clamp(32px,4.5vw,56px);line-height:1;letter-spacing:-.035em}
  .rows{border-top:1px solid var(--text)}
  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
  .plan{background:var(--bg);padding:32px;display:flex;flex-direction:column;gap:20px;transition:background .25s}
  .plan:hover{background:var(--soft)}
  .plan h3{font-weight:500;font-size:20px;letter-spacing:-.02em}
  .plan .desc{color:var(--muted);font-size:15px;margin-top:4px}
  .amount{display:flex;align-items:baseline;gap:8px}
  .amount b{font-weight:500;font-size:52px;letter-spacing:-.04em;line-height:1}
  .amount span{color:var(--muted);font-size:14px}
  .plan ul{list-style:none;display:grid;gap:10px;font-size:15px;flex:1;padding-top:20px;border-top:1px solid var(--line)}
  .plan li{display:flex;gap:10px}
  .plan li::before{content:"✓";color:var(--green)}
  .plan .when{font-size:13px;color:var(--muted)}
  .plan .btn{justify-content:center}
  .notes{display:flex;flex-wrap:wrap;gap:8px 32px;margin-top:24px;font-size:14px;color:var(--muted)}
  .work{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .work .tile{aspect-ratio:1;background:var(--soft);overflow:hidden}
  .work .tile:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
  .work .tile{position:relative}
  .work .cap{position:absolute;left:12px;bottom:10px;font-size:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);opacity:.9}
  .work img,.work video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
  .work .tile:hover img,.work .tile:hover video{transform:scale(1.03)}
  .stop{display:grid;grid-template-columns:1fr 2fr;gap:32px;padding:28px 0;border-bottom:1px solid var(--line)}
  .stop .body{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .stop b{font-weight:500;font-size:28px;letter-spacing:-.025em}
  .stop .dates{color:var(--muted);align-self:center}
  .stop.now .n{color:var(--green)}
  form{display:grid;grid-template-columns:1fr 1fr;gap:40px 32px}
  form .full{grid-column:1/-1}
  label{display:grid;gap:8px;font-size:13px;color:var(--muted)}
  input,select,textarea{border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:400 20px "Inter Tight",sans-serif;padding:8px 0;border-radius:0;appearance:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--text)}
  textarea{min-height:90px;resize:vertical}
  .actions{display:flex;gap:12px;flex-wrap:wrap}
  footer{margin-top:140px;padding:32px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer .social{display:flex;gap:24px}
  footer a:hover{color:var(--text)}
  @media (max-width:760px){
    .wrap{padding:0 16px} nav .links{display:none}
    .hero{padding-top:56px;padding-bottom:32px} .media{aspect-ratio:4/5}
    section{padding:88px 0 0}
    .head,.stop,.cred{grid-template-columns:1fr;gap:8px}
    .plans{grid-template-columns:1fr} .plan{padding:24px}
    .work{grid-template-columns:1fr 1fr} form{grid-template-columns:1fr;gap:28px}
  }
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="#" data-brand></a>
  <div class="links"><a href="#services">Pricing</a><a href="#work">Work</a><a href="#where">Location</a><a href="#book">Contact</a></div>
  <a class="btn" href="#book">Book</a>
</div></nav>

<div class="wrap hero">
  <div class="meta"><span class="dot"></span>Now in <span data-now-place></span> · <span data-now-dates></span></div>
  <h1>Aerial film<br><span>&amp; photography.</span></h1>
  <div class="hero-row">
    <p data-tagline></p>
    <div class="actions"><a class="btn" href="#book">Check availability</a><a class="btn line" href="#work">View work</a></div>
  </div>
</div>
<div class="wrap"><div class="media" id="hero-media"></div>
  <div class="cred" id="cred"><span class="label">Trusted by</span><ul></ul></div></div>

<section id="services"><div class="wrap">
  <div class="head"><span class="label">Pricing</span><h2>Simple, fixed prices.</h2></div>
  <div class="plans" id="service-list"></div>
  <div class="notes" id="notes"></div>
</div></section>

<section id="work"><div class="wrap">
  <div class="head"><span class="label">Work</span><h2>Selected frames.</h2></div>
  <div class="work" id="work-list"></div>
</div></section>

<section id="where"><div class="wrap">
  <div class="head"><span class="label">Location</span><h2>Where we are.</h2></div>
  <div class="rows" id="route"></div>
</div></section>

<section id="book"><div class="wrap">
  <div class="head"><span class="label">Contact</span><h2>Book a shoot.</h2></div>
  <form id="booking">
    <label>Name<input name="name" required autocomplete="name"></label>
    <label>Email<input name="email" type="email" autocomplete="email"></label>
    <label>Service<select name="service" id="service-select" required></select></label>
    <label>Date<input name="date" type="date"></label>
    <label class="full">Location<input name="location" placeholder="Hotel, address or area"></label>
    <label class="full">Details<textarea name="message" placeholder="Tell us about the shoot"></textarea></label>
    <div class="actions full">
      <button class="btn" type="submit" data-via="whatsapp" id="btn-wa">Send on WhatsApp</button>
      <button class="btn line" type="submit" data-via="email">Send by email</button>
    </div>
  </form>
</div></section>

<footer><div class="wrap">
  <span>© <span id="year"></span> <span data-brand></span> · <a data-email></a></span>
  <div class="social" id="social"></div>
</div></footer>

<script src="site.config.js"></script>
<script src="booking.js"></script>
<script>
  const S = window.SITE, $ = s => document.querySelector(s), all = (s, f) => document.querySelectorAll(s).forEach(f);
  const media = src => src.endsWith(".mp4") ? `<video src="${src}" muted loop playsinline autoplay></video>` : `<img src="${src}" alt="" loading="lazy">`;
  document.title = S.brand + " · Aerial Film & Photography";
  all("[data-brand]", e => e.textContent = S.brand);
  all("[data-now-place]", e => e.textContent = S.now.place);
  all("[data-now-dates]", e => e.textContent = Booking.formatRange(S.now.from, S.now.to));
  $("[data-tagline]").textContent = S.tagline;
  const mail = $("[data-email]"); mail.textContent = S.email; mail.href = "mailto:" + S.email;
  $("#year").textContent = new Date().getFullYear();
  if (S.credentials?.length) $("#cred ul").innerHTML = S.credentials.map(c => { const [who, what] = c.split(" — "); return `<li>${who}${what ? ` <span>— ${what}</span>` : ""}</li>`; }).join("");
  else $("#cred").remove();
  if (S.hero) $("#hero-media").innerHTML = `<video src="${S.hero}" poster="${S.heroPoster || ""}" muted loop playsinline autoplay preload="auto"></video>`;

  $("#service-list").innerHTML = S.services.map(s => `<div class="plan">
      <div><h3>${s.name}</h3><p class="desc">${s.desc}</p></div>
      <div class="amount"><b>$${s.price.toLocaleString("en-US")}</b><span>${s.unit}</span></div>
      <ul>${s.includes.map(i => `<li>${i}</li>`).join("")}</ul>
      <span class="when">Delivered in ${s.delivery}</span>
      <a class="btn line" href="#book" data-pick="${s.name}">Book this</a></div>`).join("");
  $("#notes").innerHTML = [...S.pricingNotes, S.faaCertified ? "FAA Part 107 certified · Insured" : ""].filter(Boolean).map(n => `<span>${n}</span>`).join("");
  all("[data-pick]", a => a.addEventListener("click", () => $("#service-select").value = a.dataset.pick));
  $("#service-select").innerHTML = S.services.map(s => `<option value="${s.name}">${s.name} · $${s.price.toLocaleString("en-US")}</option>`).join("") + "<option>Something else</option>";

  // Portfolio: put files in public/media and list them in site.config.js → work.
  const work = S.work || [];
  $("#work-list").innerHTML = (work.length ? work : Array(7).fill(null)).map(w => `<div class="tile">${w ? media(w.src) + `<span class="cap">${w.caption}</span>` : ""}</div>`).join("");

  const stop = (s, now) => `<div class="stop ${now ? "now" : ""}"><span class="n label">${now ? "● Now" : "Next"}</span><div class="body"><b>${s.place}</b><span class="dates">${Booking.formatRange(s.from, s.to)}</span></div></div>`;
  $("#route").innerHTML = stop(S.now, true) + S.next.map(s => stop(s, false)).join("");

  const links = [["instagram", "https://instagram.com/", "Instagram"], ["youtube", "https://youtube.com/@", "YouTube"], ["tiktok", "https://tiktok.com/@", "TikTok"]];
  $("#social").innerHTML = links.filter(([k]) => S[k]).map(([k, u, n]) => `<a href="${u}${S[k]}" target="_blank" rel="noopener">${n}</a>`).join("");

  if (!S.whatsapp) $("#btn-wa").remove();
  $("#booking").addEventListener("submit", e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const url = e.submitter.dataset.via === "whatsapp" ? Booking.whatsappLink(S.whatsapp, Booking.bookingMessage(d)) : Booking.mailtoLink(S.email, d);
    window.open(url, "_blank");
  });
</script>
</body>
</html>
